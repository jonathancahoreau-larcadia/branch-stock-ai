<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Branch Stock AI{% endblock %}</title>
  <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="page">
    <header class="page__header">
      <h1>Branch Stock AI</h1>
      {% if current_user %}
      <nav class="nav">
        <a href="{{ url_for('dashboard') }}" class="nav__link">Tableau de bord</a>
        <a href="{{ url_for('stock') }}" class="nav__link">Stock</a>
        {% if current_user.role == 'admin' %}
        <a href="{{ url_for('users') }}" class="nav__link">Utilisateurs</a>
        {% endif %}
        <a href="{{ url_for('logout') }}" class="nav__link nav__link--logout">Déconnexion</a>
      </nav>
      {% endif %}
    </header>

    <main>
      {% block content %}{% endblock %}
    </main>
  </div>
</body>
</html>

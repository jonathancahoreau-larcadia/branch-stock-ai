<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Backoffice — Branch Stock AI{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="app">
    <!-- Sidebar injected by JavaScript -->
    <div id="main-navigation"></div>

    <main class="app__main">
      <!-- Flash messages container (injected by JS) -->
      <div id="flash-messages"></div>

      <!-- Page-level error display -->
      <div id="page-error" class="alert alert--error" hidden></div>

      {% block content %}{% endblock %}
    </main>
  </div>

  <!-- JavaScript modules loaded in dependency order -->
  <script src="{{ url_for('static', filename='js/config.js') }}"></script>
  <script src="{{ url_for('static', filename='js/utils.js') }}"></script>
  <script src="{{ url_for('static', filename='js/api.js') }}"></script>
  <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
  <script src="{{ url_for('static', filename='js/modals.js') }}"></script>
  <script src="{{ url_for('static', filename='js/navigation.js') }}"></script>
  <script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
  <script src="{{ url_for('static', filename='js/products.js') }}"></script>
  <script src="{{ url_for('static', filename='js/stocks.js') }}"></script>
  <script src="{{ url_for('static', filename='js/branches.js') }}"></script>
  <script src="{{ url_for('static', filename='js/users.js') }}"></script>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
</write_to_file>

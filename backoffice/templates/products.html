{% extends "base.html" %}
{% block title %}Produits — Backoffice Branch Stock AI{% endblock %}
{% block content %}
<div class="page-header">
  <h1>Produits</h1>
  <p class="page-header__subtitle">Catalogue produits — consultation uniquement</p>
</div>

<div class="filters">
  <form method="GET" action="/products" class="form form--inline" id="product-filters">
    <div class="form__group">
      <label for="q">Recherche</label>
      <input type="text" id="q" name="q" placeholder="Nom, SKU…">
    </div>
    <div class="form__group">
      <label for="category">Catégorie</label>
      <input type="text" id="category" name="category" placeholder="Catégorie">
    </div>
    <div class="form__group">
      <label for="sort">Tri</label>
      <select id="sort" name="sort">
        <option value="">— Défaut —</option>
        <option value="name">Nom A-Z</option>
        <option value="-name">Nom Z-A</option>
        <option value="sku">SKU A-Z</option>
        <option value="-sku">SKU Z-A</option>
        <option value="unit_price">Prix croissant</option>
        <option value="-unit_price">Prix décroissant</option>
        <option value="updated_at">Récent</option>
        <option value="-updated_at">Ancien</option>
      </select>
    </div>
    <div class="form__group form__group--checkbox">
      <label>
        <input type="checkbox" name="include_discontinued" value="true">
        Inclure les produits discontinués
      </label>
    </div>
    <div class="form__actions">
      <button type="submit" class="btn btn--primary">Filtrer</button>
      <a href="/products" class="btn btn--outline">Réinitialiser</a>
    </div>
  </form>
</div>

<div class="table-container">
  <table class="table" data-testid="products-table">
    <thead>
      <tr>
        <th>SKU</th>
        <th>Nom</th>
        <th>Catégorie</th>
        <th>Marque</th>
        <th>Prix unitaire</th>
        <th>Discontinué</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="products-table-body">
      <tr>
        <td colspan="7" class="table__empty">Chargement…</td>
      </tr>
    </tbody>
  </table>
</div>

<div class="pagination">
  <span class="pagination__info" id="pagination-info"></span>
  <div class="pagination__controls">
    <form method="GET" action="/products" class="form form--inline pagination__jump" id="page-jump-form">
      <label for="page-jump">Aller à la page</label>
      <input type="number" id="page-jump" name="page" min="1" value="1" class="input--sm">
      <input type="hidden" name="limit" value="20">
      <button type="submit" class="btn btn--sm">Aller</button>
    </form>
  </div>
</div>

<script>
// Override initProductsPage to handle filter form submission and page jump
const _origInitProducts = initProductsPage;
initProductsPage = async function() {
  await _origInitProducts();

  // Restore filter values from URL
  const params = new URLSearchParams(window.location.search);
  document.getElementById("q").value = params.get("q") || "";
  document.getElementById("category").value = params.get("category") || "";
  document.getElementById("sort").value = params.get("sort") || "";
  document.getElementById("include_discontinued").checked = params.get("include_discontinued") === "true";

  // Handle filter form submission
  document.getElementById("product-filters").addEventListener("submit", function(e) {
    e.preventDefault();
    const formData = new FormData(this);
    const params = new URLSearchParams();
    for (const [key, value] of formData.entries()) {
      if (value) params.set(key, value);
    }
    window.location.href = "/products?" + params.toString();
  });

  // Handle page jump
  document.getElementById("page-jump-form").addEventListener("submit", function(e) {
    e.preventDefault();
    const page = parseInt(document.getElementById("page-jump").value, 10);
    if (page < 1) return;
    const limit = 20;
    const offset = (page - 1) * limit;
    const params = new URLSearchParams(window.location.search);
    params.set("offset", String(offset));
    params.set("limit", String(limit));
    window.location.href = "/products?" + params.toString();
  });
};
</script>
{% endblock %}
</write_to_file>

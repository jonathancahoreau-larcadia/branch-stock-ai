{% extends "base.html" %}
{% block title %}Stocks — Backoffice Branch Stock AI{% endblock %}
{% block content %}
<div class="page-header">
  <h1>Stocks</h1>
  <p class="page-header__subtitle">Succursale : <strong id="stock-branch-name"></strong></p>
</div>

<div class="filters">
  <form method="GET" action="/stocks" class="form form--inline" id="stock-filters">
    <div class="form__group form__group--checkbox">
      <label>
        <input type="checkbox" name="available_only" value="false">
        Afficher tous les stocks (y compris quantité nulle)
      </label>
    </div>
    <div class="form__actions">
      <button type="submit" class="btn btn--primary">Filtrer</button>
    </div>
  </form>
</div>

<div class="card card--actions" id="stock-actions-card">
    <h3>Gestion du stock</h3>

    <div class="stock-actions">
        <!-- Ajout -->
        <form id="stock-add-form" class="form form--inline">
            <div class="form__group">
                <label>Produit (SKU)</label>
                <input type="text" name="external_product_id" placeholder="ex: HB-MON-2102" required>
            </div>
            <div class="form__group">
                <label>Quantité</label>
                <input type="number" name="quantity" min="1" value="1" required>
            </div>
            <button class="btn btn--success">Ajouter</button>
        </form>

        <!-- Retrait -->
        <form id="stock-remove-form" class="form form--inline">
            <div class="form__group">
                <label>Produit (SKU)</label>
                <input type="text" name="external_product_id" placeholder="ex: HB-MON-2102" required>
            </div>
            <div class="form__group">
                <label>Quantité</label>
                <input type="number" name="quantity" min="1" value="1" required>
            </div>
            <button class="btn btn--danger">Retirer</button>
        </form>
    </div>
</div>

<!-- Barre de recherche -->
<div class="card">
  <form method="GET" action="/stocks" class="form form--inline" id="stock-search-form">
    <div class="form__group">
      <label>Rechercher un produit</label>
      <input type="text" name="search" id="stock-search" placeholder="Nom du produit ou SKU" style="min-width: 280px;">
    </div>
    <div class="form__group form__group--checkbox">
      <label>
        <input type="checkbox" name="available_only" value="false">
        Tout afficher
      </label>
    </div>
    <button type="submit" class="btn btn--primary">Rechercher</button>
    <a href="/stocks" class="btn btn--outline" id="stock-clear-search" hidden>Effacer</a>
  </form>
</div>

<div class="table-container">
  <table class="table" data-testid="stocks-table">
    <thead>
      <tr>
        <th>ID Produit (SKU)</th>
        <th>Nom produit</th>
        <th>Quantité</th>
      </tr>
    </thead>
    <tbody id="stocks-table-body">
      <tr>
        <td colspan="3" class="table__empty">Chargement…</td>
      </tr>
    </tbody>
  </table>
</div>

<script>
// Override initStocksPage to handle filter/search forms
const _origInitStocks = initStocksPage;
initStocksPage = async function() {
  await _origInitStocks();

  // Show branch name from user info
  const user = getCurrentUser();
  const branchNameEl = document.getElementById("stock-branch-name");
  if (branchNameEl && user && user.branch) {
    branchNameEl.textContent = user.branch.name;
  }

  // Restore filter values from URL
  const params = new URLSearchParams(window.location.search);
  document.getElementById("stock-search").value = params.get("search") || "";
  document.getElementById("stock-clear-search").hidden = !params.get("search");

  // Handle filter form submission
  document.getElementById("stock-filters").addEventListener("submit", function(e) {
    e.preventDefault();
    const formData = new FormData(this);
    const params = new URLSearchParams();
    for (const [key, value] of formData.entries()) {
      if (value) params.set(key, value);
    }
    window.location.href = "/stocks?" + params.toString();
  });

  // Handle search form submission
  document.getElementById("stock-search-form").addEventListener("submit", function(e) {
    e.preventDefault();
    const formData = new FormData(this);
    const params = new URLSearchParams();
    for (const [key, value] of formData.entries()) {
      if (value) params.set(key, value);
    }
    window.location.href = "/stocks?" + params.toString();
  });
};
</script>
{% endblock %}
</write_to_file>

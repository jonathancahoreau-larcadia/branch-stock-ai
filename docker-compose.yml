services:
  database:
    image: postgres@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
    environment:
      POSTGRES_DB: "${POSTGRES_DB:?required}"
      POSTGRES_USER: "${POSTGRES_USER:?required}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?required}"
      MIGRATION_DB_USER: "${MIGRATION_DB_USER:?required}"
      BACKOFFICE_DB_USER: "${BACKOFFICE_DB_USER:?required}"
      STOCK_MCP_DB_USER: "${STOCK_MCP_DB_USER:?required}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready --username "$$POSTGRES_USER" --dbname "$$POSTGRES_DB"'
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - branch-stock-internal

  external-products-api:
    image: hbntory-products-api-external-products-api@sha256:bc3d2e796577ec36b3ab272def86f6b5831a70510432c0946a62a2b5f6fed00c
    environment:
      HBN_PRODUCTS_PORT: 5000
      HBN_PRODUCTS_LATENCY_MS: 0
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - 'import json, urllib.request; response = urllib.request.urlopen("http://127.0.0.1:5000/health"); payload = json.load(response); assert response.status == 200 and all(key in payload for key in ("status", "products", "suppliers"))'
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - branch-stock-internal

  backoffice-api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      POSTGRES_DB: "${POSTGRES_DB:?required}"
      POSTGRES_USER: "${POSTGRES_USER:?required}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?required}"
      MIGRATION_DB_USER: "${MIGRATION_DB_USER:?required}"
      MIGRATION_DB_PASSWORD: "${MIGRATION_DB_PASSWORD:?required}"
      BACKOFFICE_DB_USER: "${BACKOFFICE_DB_USER:?required}"
      BACKOFFICE_DB_PASSWORD: "${BACKOFFICE_DB_PASSWORD:?required}"
      STOCK_MCP_DB_USER: "${STOCK_MCP_DB_USER:?required}"
      STOCK_MCP_DB_PASSWORD: "${STOCK_MCP_DB_PASSWORD:?required}"
      MIGRATION_DATABASE_URL: "${MIGRATION_DATABASE_URL:?required}"
      DATABASE_URL: "${DATABASE_URL:?required}" # ${BACKOFFICE_DB_USER}
      STOCK_MCP_DATABASE_URL: "${STOCK_MCP_DATABASE_URL:?required}"
      JWT_SECRET_KEY: "${JWT_SECRET_KEY:?required}"
      ADMIN_INITIAL_PASSWORD: "${ADMIN_INITIAL_PASSWORD:?required}"
      SEED_PRODUCT_ID: "${SEED_PRODUCT_ID:-HB-MON-2102}"
      BCRYPT_ROUNDS: "${BCRYPT_ROUNDS:-12}"
      PRODUCT_API_BASE_URL: http://external-products-api:5000
      PRODUCT_API_TIMEOUT: "${PRODUCT_API_TIMEOUT:-5}"
    entrypoint:
      - /app/docker/backoffice-entrypoint.sh
    depends_on:
      database:
        condition: service_healthy
      external-products-api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - 'import json, urllib.request; response = urllib.request.urlopen("http://127.0.0.1:5000/health"); payload = json.load(response); assert response.status == 200 and payload == {"status": "ok"}'
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - branch-stock-internal

  backoffice-ui:
    build:
      context: ./backoffice/static
      dockerfile: Dockerfile
    depends_on:
      backoffice-api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${BACKOFFICE_UI_PORT:-8080}:80"
    healthcheck:
      test:
        - CMD-SHELL
        - 'wget -q -O /dev/null http://127.0.0.1/ && wget -q -O /dev/null http://127.0.0.1/health'
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - branch-stock-internal
      - branch-stock-public

  product_mcp_server:
    build:
      context: .
      dockerfile: product_mcp_server/Dockerfile
    command: python -m product_mcp_server.server
    environment:
      PRODUCT_API_BASE_URL: http://external-products-api:5000
      PRODUCT_API_TIMEOUT: "${PRODUCT_API_TIMEOUT:-5}"
    depends_on:
      external-products-api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - 'import json, urllib.request; response = urllib.request.urlopen("http://127.0.0.1:8100/health"); payload = json.load(response); assert response.status == 200 and payload == {"status": "ok"}'
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - branch-stock-internal

  stock_mcp_server:
    build:
      context: .
      dockerfile: stock_mcp_server/Dockerfile
    command: python -m stock_mcp_server.server
    environment:
      STOCK_MCP_DATABASE_URL: "${STOCK_MCP_DATABASE_URL:?required}" # ${STOCK_MCP_DB_USER}
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - 'import json, urllib.request; response = urllib.request.urlopen("http://127.0.0.1:8200/health"); payload = json.load(response); assert response.status == 200 and payload == {"status": "ok"}'
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - branch-stock-internal

  ai_service:
    build:
      context: .
      dockerfile: ai_service/Dockerfile
    command: python -m ai_service.server
    environment:
      PRODUCT_MCP_URL: http://product_mcp_server:8100/mcp
      STOCK_MCP_URL: http://stock_mcp_server:8200/mcp
      AI_SERVICE_PORT: 8000
      CLIENT_WEB_ORIGIN: "${CLIENT_WEB_ORIGIN:-http://127.0.0.1:3000}"
    depends_on:
      product_mcp_server:
        condition: service_healthy
      stock_mcp_server:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - 'import json, urllib.request; response = urllib.request.urlopen("http://127.0.0.1:8000/health"); payload = json.load(response); assert response.status == 200 and payload == {"status": "ok"}'
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - branch-stock-internal

  client_web:
    build:
      context: ./client_web
      dockerfile: Dockerfile
    depends_on:
      ai_service:
        condition: service_healthy
    ports:
      - "127.0.0.1:${CLIENT_WEB_PORT:-3000}:80"
    healthcheck:
      test:
        - CMD-SHELL
        - 'wget -q -O /dev/null http://127.0.0.1/'
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - branch-stock-internal
      - branch-stock-public

networks:
  branch-stock-internal:
    driver: bridge
    name: branch-stock-internal
    internal: true
  branch-stock-public:
    driver: bridge
    name: branch-stock-public

volumes:
  postgres-data:

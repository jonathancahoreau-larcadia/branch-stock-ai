version: "3.9"

services:
  # ── Base de données ──────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: hbntory-db
    environment:
      POSTGRES_DB: hbntory
      POSTGRES_USER: hbntory
      POSTGRES_PASSWORD: hbntory
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hbntory"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Backoffice API (Flask + Gunicorn) ────────────────────────
  backoffice:
    build:
      context: .
      dockerfile: backoffice/Dockerfile
    container_name: hbntory-backoffice
    environment:
      DATABASE_URL: postgresql://hbntory:hbntory@postgres:5432/hbntory
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-jwt-secret-key-change-in-production}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-admin123}
      SEED_PRODUCT_ID: ${SEED_PRODUCT_ID:-HB-MON-2102}
      PRODUCT_API_BASE_URL: ${PRODUCT_API_BASE_URL:-http://product-api:5001}
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy

  # ── Client Web (Nginx — HTML statique) ───────────────────────
  client-web:
    build:
      context: ./client_web
      dockerfile: Dockerfile
    container_name: hbntory-client-web
    ports:
      - "8080:80"
    depends_on:
      - backoffice

volumes:
  pgdata:
